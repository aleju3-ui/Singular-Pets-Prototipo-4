<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Singular Pets — Alertas Médicas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange:#F87141; --orange-dark:#E05E2A; --orange-pale:#FEF0E9; --orange-mid:#FDDDCC;
      --charcoal:#333333; --gray:#8E8E93; --gray-light:#F5F5F7; --gray-mid:#E5E5EA;
      --white:#FFFFFF; --text:#1C1C1E;
      --ok:#34C759; --ok-bg:#F0FBF3; --ok-text:#1A7A35;
      --warn-bg:#FFF8F0; --warn-text:#C45E00; --warn-border:#FDDDCC;
      --danger:#FF3B30; --danger-bg:#FFF2F1; --danger-text:#9B1C1C;
      --shadow-sm:0 2px 8px rgba(0,0,0,0.05); --shadow-md:0 4px 16px rgba(0,0,0,0.07); --shadow-lg:0 20px 48px rgba(0,0,0,0.12);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--gray-light);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}

    /* NAV */
    nav{background:var(--white);border-bottom:1px solid var(--gray-mid);position:sticky;top:0;z-index:100;padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:var(--shadow-sm);}
    .nav-brand{display:flex;align-items:center;gap:10px;}
    .nav-icon{width:36px;height:36px;background:var(--orange);border-radius:10px;display:flex;align-items:center;justify-content:center;}
    .nav-icon svg{width:20px;height:20px;fill:white;}
    .nav-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
    .nav-back{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--gray-light);border:1px solid var(--gray-mid);border-radius:9999px;color:var(--charcoal);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s;}
    .nav-back:hover{background:var(--gray-mid);}

    /* WRAP */
    .wrap{max-width:900px;margin:0 auto;padding:32px 24px 60px;}

    /* HEADER */
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
    .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
    .page-subtitle{font-size:14px;color:var(--gray);margin-top:4px;}
    .btn-add-alert{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--orange);color:white;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;box-shadow:0 4px 14px rgba(248,113,65,0.28);}
    .btn-add-alert:hover{background:var(--orange-dark);}

    /* RESUMEN */
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
    .summary-card{background:var(--white);border:1px solid var(--gray-mid);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);}
    .summary-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .summary-icon.ok{background:var(--ok-bg);}
    .summary-icon.warn{background:var(--warn-bg);}
    .summary-icon.danger{background:var(--danger-bg);}
    .summary-num{font-size:26px;font-weight:800;line-height:1;}
    .summary-num.ok{color:var(--ok-text);}
    .summary-num.warn{color:var(--warn-text);}
    .summary-num.danger{color:var(--danger-text);}
    .summary-lbl{font-size:12px;color:var(--gray);margin-top:3px;}

    /* FILTROS */
    .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .filter-btn{padding:8px 16px;border-radius:9999px;border:1.5px solid var(--gray-mid);background:var(--white);color:var(--gray);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
    .filter-btn:hover{border-color:var(--orange);color:var(--orange);}
    .filter-btn.active{background:var(--orange);color:white;border-color:var(--orange);}

    /* ALERTAS */
    .alerts-list{display:flex;flex-direction:column;gap:12px;}

    .alert-card{background:var(--white);border:1px solid var(--gray-mid);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s;}
    .alert-card:hover{box-shadow:var(--shadow-md);}
    .alert-card.warn{border-color:var(--warn-border);background:var(--warn-bg);}
    .alert-card.danger{border-color:rgba(255,59,48,0.25);background:var(--danger-bg);}
    .alert-card.ok{border-color:rgba(52,199,89,0.2);background:var(--ok-bg);}

    .alert-indicator{width:4px;height:56px;border-radius:4px;flex-shrink:0;}
    .alert-indicator.ok{background:var(--ok);}
    .alert-indicator.warn{background:var(--orange);}
    .alert-indicator.danger{background:var(--danger);}

    .alert-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .alert-icon.ok{background:rgba(52,199,89,0.12);}
    .alert-icon.warn{background:rgba(248,113,65,0.12);}
    .alert-icon.danger{background:rgba(255,59,48,0.1);}

    .alert-info{flex:1;min-width:0;}
    .alert-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
    .alert-meta{font-size:12px;color:var(--gray);display:flex;gap:12px;flex-wrap:wrap;}
    .alert-meta span{display:flex;align-items:center;gap:4px;}

    .alert-badge{padding:5px 12px;border-radius:9999px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
    .alert-badge.ok{background:var(--ok-bg);color:var(--ok-text);}
    .alert-badge.warn{background:var(--orange-pale);color:var(--orange);}
    .alert-badge.danger{background:var(--danger-bg);color:var(--danger-text);}

    .alert-actions{display:flex;gap:6px;flex-shrink:0;}
    .btn-alert{padding:7px 12px;border:1.5px solid var(--gray-mid);border-radius:9999px;background:var(--white);color:var(--charcoal);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
    .btn-alert:hover{border-color:var(--orange);color:var(--orange);}
    .btn-alert.del{color:var(--danger-text);border-color:rgba(255,59,48,0.2);}
    .btn-alert.del:hover{background:var(--danger-bg);}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:60px 20px;}
    .empty-state .emoji{font-size:48px;margin-bottom:16px;}
    .empty-state h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .empty-state p{font-size:14px;color:var(--gray);}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;align-items:center;justify-content:center;padding:16px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--white);border-radius:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:mIn .22s ease;}
    @keyframes mIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    .modal-header{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .modal-title{font-size:20px;font-weight:800;color:var(--text);}
    .modal-close{width:32px;height:32px;border:none;background:var(--gray-light);border-radius:50%;cursor:pointer;font-size:16px;color:var(--gray);display:flex;align-items:center;justify-content:center;}
    .modal-close:hover{background:var(--gray-mid);}
    .modal-body{padding:0 24px 24px;}

    .form-group{margin-bottom:14px;}
    .form-label{display:block;font-size:12px;font-weight:600;color:var(--charcoal);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
    .form-input{width:100%;padding:11px 14px;background:var(--gray-light);border:1.5px solid var(--gray-mid);border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
    .form-input:focus{border-color:var(--orange);background:var(--white);box-shadow:0 0 0 3px rgba(248,113,65,0.1);}
    .form-select{width:100%;padding:11px 14px;background:var(--gray-light);border:1.5px solid var(--gray-mid);border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;cursor:pointer;}
    .form-select:focus{border-color:var(--orange);}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    textarea.form-input{resize:vertical;min-height:80px;}

    .modal-footer{display:flex;gap:10px;margin-top:20px;}
    .btn-primary{flex:1;padding:13px;background:var(--orange);color:white;border:none;border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;transition:background .2s;}
    .btn-primary:hover{background:var(--orange-dark);}
    .btn-ghost{padding:13px 20px;background:var(--gray-light);color:var(--charcoal);border:1px solid var(--gray-mid);border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;}
    .btn-ghost:hover{background:var(--gray-mid);}
    .btn-delete{padding:13px 16px;background:var(--danger-bg);color:var(--danger-text);border:1px solid rgba(255,59,48,0.2);border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;}

    /* BANNER ALERTA URGENTE */
    .banner-urgente{background:var(--danger-bg);border:1px solid rgba(255,59,48,0.25);border-radius:16px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;}
    .banner-urgente.hidden{display:none;}
    .banner-urgente-icon{font-size:24px;flex-shrink:0;}
    .banner-urgente p{font-size:14px;color:var(--danger-text);font-weight:500;line-height:1.5;}
    .banner-urgente strong{font-weight:700;}

    /* TOAST */
    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;color:white;background:var(--charcoal);box-shadow:var(--shadow-lg);animation:tIn .3s ease;}
    .toast.ok{background:#1A7A35;}
    .toast.warn{background:var(--orange);}
    .toast.err{background:var(--danger);}
    @keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:640px){
      nav{padding:0 16px;}
      .wrap{padding:20px 16px 48px;}
      .summary-grid{grid-template-columns:1fr;}
      .form-row{grid-template-columns:1fr;}
      .alert-actions{flex-direction:column;}
    }
  </style>
</head>
<body>

<nav>
  <a href="../prototipo/singular_prototipods.html" class="nav-brand" style="text-decoration:none;">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><ellipse cx="6" cy="7" rx="2.2" ry="3"/><ellipse cx="11" cy="5" rx="1.8" ry="2.5"/><ellipse cx="16" cy="6" rx="1.8" ry="2.5"/><ellipse cx="19.5" cy="10" rx="1.8" ry="2.5"/><path d="M12 11c-4 0-7 3-5.5 7.5C7.5 21 10 21.5 12 21.5s4.5-.5 5.5-3C19 14 16 11 12 11z"/></svg>
    </div>
    <span class="nav-name">Singular Pets</span>
  </a>
  <a href="singular_interfaz_usuario_final.html" class="nav-back">← Volver al panel</a>
</nav>

<div class="wrap">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h1 class="page-title">🩺 Alertas médicas</h1>
      <p class="page-subtitle">Recordatorios de vacunas, desparasitación y controles veterinarios</p>
    </div>
    <button class="btn-add-alert" onclick="abrirCrear()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nueva alerta
    </button>
  </div>

  <!-- BANNER URGENTE -->
  <div class="banner-urgente hidden" id="bannerUrgente">
    <div class="banner-urgente-icon">🚨</div>
    <p id="bannerUrgenteText">Tienes alertas que requieren atención inmediata.</p>
  </div>

  <!-- RESUMEN -->
  <div class="summary-grid">
    <div class="summary-card">
      <div class="summary-icon ok">✅</div>
      <div><div class="summary-num ok" id="countOk">0</div><div class="summary-lbl">Al día</div></div>
    </div>
    <div class="summary-card">
      <div class="summary-icon warn">⚠️</div>
      <div><div class="summary-num warn" id="countWarn">0</div><div class="summary-lbl">Próximas (≤5 días)</div></div>
    </div>
    <div class="summary-card">
      <div class="summary-icon danger">🔴</div>
      <div><div class="summary-num danger" id="countDanger">0</div><div class="summary-lbl">Vencidas</div></div>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('todas', this)">Todas</button>
    <button class="filter-btn" onclick="setFilter('ok', this)">Al día</button>
    <button class="filter-btn" onclick="setFilter('warn', this)">Próximas</button>
    <button class="filter-btn" onclick="setFilter('danger', this)">Vencidas</button>
  </div>

  <!-- LISTA -->
  <div class="alerts-list" id="alertsList"></div>

</div>

<!-- MODAL CREAR/EDITAR -->
<div class="modal-overlay" id="modalAlerta">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Nueva alerta</h2>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mascota *</label>
          <select class="form-select" id="fMascota"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Tipo de alerta *</label>
          <select class="form-select" id="fTipo">
            <option value="Vacuna">💉 Vacuna</option>
            <option value="Desparasitación">🪱 Desparasitación</option>
            <option value="Control veterinario">🩺 Control veterinario</option>
            <option value="Medicamento">💊 Medicamento</option>
            <option value="Baño y peluquería">✂️ Baño y peluquería</option>
            <option value="Otro">📋 Otro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <input class="form-input" id="fDesc" type="text" placeholder="Ej: Vacuna antirrábica anual">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Fecha programada *</label>
          <input class="form-input" id="fFecha" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">Recordar antes (días)</label>
          <select class="form-select" id="fRecordar">
            <option value="3">3 días antes</option>
            <option value="5" selected>5 días antes</option>
            <option value="7">7 días antes</option>
            <option value="14">14 días antes</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notas adicionales</label>
        <textarea class="form-input" id="fNotas" placeholder="Ej: Llevar carnet de vacunación..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-delete" id="btnEliminarAlerta" onclick="eliminarAlerta()" style="display:none">🗑</button>
        <button class="btn-primary" onclick="guardarAlerta()">Guardar alerta</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let alertas = JSON.parse(localStorage.getItem('SP_ALERTAS') || 'null');
if (!alertas) {
  alertas = [
    { id: 1, mascota:'Fiodor', tipo:'Desparasitación', desc:'Desparasitación trimestral', fecha:'2026-05-20', recordar:5, notas:'' },
    { id: 2, mascota:'Bruno', tipo:'Vacuna', desc:'Vacuna antirrábica anual', fecha:'2026-05-19', recordar:5, notas:'Llevar carnet' },
    { id: 3, mascota:'Bruno', tipo:'Control veterinario', desc:'Control de rutina', fecha:'2026-06-15', recordar:5, notas:'' },
    { id: 4, mascota:'Fiodor', tipo:'Medicamento', desc:'Antiparasitario mensual', fecha:'2026-05-30', recordar:3, notas:'' }
  ];
  guardarAlertas();
}

let pets = JSON.parse(localStorage.getItem('SP_PETS2') || '[]');
let editId = null;
let filtroActivo = 'todas';

function guardarAlertas() { localStorage.setItem('SP_ALERTAS', JSON.stringify(alertas)); }

// ═══════════════════════════════════════
// CALCULAR ESTADO
// ═══════════════════════════════════════
function getEstado(alerta) {
  const today = new Date(); today.setHours(0,0,0,0);
  const fecha = new Date(alerta.fecha); fecha.setHours(0,0,0,0);
  const diff = Math.round((fecha - today) / 86400000);

  if (diff < 0) return { tipo: 'danger', diff, texto: `Vencida hace ${Math.abs(diff)} día${Math.abs(diff)!==1?'s':''}`, emoji: '🔴' };
  if (diff === 0) return { tipo: 'warn', diff, texto: 'Vence hoy', emoji: '🟠' };
  if (diff <= alerta.recordar) return { tipo: 'warn', diff, texto: `Faltan ${diff} día${diff!==1?'s':''}`, emoji: '🟠' };
  return { tipo: 'ok', diff, texto: `Faltan ${diff} días`, emoji: '🟢' };
}

function formatFecha(f) {
  return new Date(f).toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' });
}

function getTipoEmoji(tipo) {
  const map = { 'Vacuna':'💉', 'Desparasitación':'🪱', 'Control veterinario':'🩺', 'Medicamento':'💊', 'Baño y peluquería':'✂️', 'Otro':'📋' };
  return map[tipo] || '📋';
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render() {
  const list = document.getElementById('alertsList');

  // Ordenar: danger primero, luego warn, luego ok, por fecha
  const sorted = [...alertas].sort((a, b) => {
    const ea = getEstado(a), eb = getEstado(b);
    const order = { danger: 0, warn: 1, ok: 2 };
    if (order[ea.tipo] !== order[eb.tipo]) return order[ea.tipo] - order[eb.tipo];
    return new Date(a.fecha) - new Date(b.fecha);
  });

  // Filtrar
  const filtered = filtroActivo === 'todas' ? sorted : sorted.filter(a => getEstado(a).tipo === filtroActivo);

  // Contadores
  let cOk = 0, cWarn = 0, cDanger = 0;
  alertas.forEach(a => {
    const e = getEstado(a);
    if (e.tipo === 'ok') cOk++;
    else if (e.tipo === 'warn') cWarn++;
    else cDanger++;
  });
  document.getElementById('countOk').textContent = cOk;
  document.getElementById('countWarn').textContent = cWarn;
  document.getElementById('countDanger').textContent = cDanger;

  // Banner urgente
  const banner = document.getElementById('bannerUrgente');
  if (cDanger > 0 || cWarn > 0) {
    banner.classList.remove('hidden');
    const msgs = [];
    if (cDanger > 0) msgs.push(`<strong>${cDanger} alerta${cDanger!==1?'s':''} vencida${cDanger!==1?'s':''}</strong>`);
    if (cWarn > 0) msgs.push(`<strong>${cWarn} próxima${cWarn!==1?'s':''}</strong>`);
    document.getElementById('bannerUrgenteText').innerHTML = `⚠️ Tienes ${msgs.join(' y ')} que requieren atención.`;
  } else {
    banner.classList.add('hidden');
  }

  // Lista
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🩺</div>
        <h3>No hay alertas${filtroActivo !== 'todas' ? ' en esta categoría' : ''}</h3>
        <p>Agrega recordatorios médicos para tus mascotas</p>
      </div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach(a => {
    const e = getEstado(a);
    const card = document.createElement('div');
    card.className = `alert-card ${e.tipo}`;
    card.innerHTML = `
      <div class="alert-indicator ${e.tipo}"></div>
      <div class="alert-icon ${e.tipo}">${getTipoEmoji(a.tipo)}</div>
      <div class="alert-info">
        <div class="alert-title">${a.mascota} · ${a.tipo}</div>
        <div class="alert-meta">
          <span>📅 ${formatFecha(a.fecha)}</span>
          ${a.desc ? `<span>📝 ${a.desc}</span>` : ''}
          ${a.notas ? `<span>💬 ${a.notas}</span>` : ''}
        </div>
      </div>
      <div class="alert-badge ${e.tipo}">${e.texto}</div>
      <div class="alert-actions">
        <button class="btn-alert" onclick="abrirEditar(${a.id})">✏️ Editar</button>
        <button class="btn-alert del" onclick="confirmarEliminar(${a.id})">🗑</button>
      </div>`;
    list.appendChild(card);
  });
}

// ═══════════════════════════════════════
// FILTROS
// ═══════════════════════════════════════
function setFilter(f, btn) {
  filtroActivo = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ═══════════════════════════════════════
// MODAL
// ═══════════════════════════════════════
function poblarMascotas() {
  const sel = document.getElementById('fMascota');
  sel.innerHTML = '';

  // Mascotas del sistema
  const nombres = pets.length > 0
    ? pets.map(p => p.nombre)
    : ['Bruno', 'Fiodor'];

  // También incluir mascotas ya en alertas
  alertas.forEach(a => { if (!nombres.includes(a.mascota)) nombres.push(a.mascota); });

  nombres.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });

  // Opción para escribir nombre nuevo
  const optNew = document.createElement('option');
  optNew.value = '__nueva__'; optNew.textContent = '+ Otra mascota...';
  sel.appendChild(optNew);

  sel.addEventListener('change', () => {
    if (sel.value === '__nueva__') {
      const nombre = prompt('Nombre de la mascota:');
      if (nombre) {
        const opt = document.createElement('option');
        opt.value = nombre; opt.textContent = nombre;
        sel.insertBefore(opt, sel.lastChild);
        sel.value = nombre;
      } else {
        sel.value = nombres[0];
      }
    }
  });
}

function abrirCrear() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Nueva alerta';
  document.getElementById('btnEliminarAlerta').style.display = 'none';
  document.getElementById('fDesc').value = '';
  document.getElementById('fNotas').value = '';
  document.getElementById('fTipo').value = 'Vacuna';
  document.getElementById('fRecordar').value = '5';

  // Fecha default: hoy + 30 días
  const d = new Date(); d.setDate(d.getDate() + 30);
  document.getElementById('fFecha').value = d.toISOString().split('T')[0];

  poblarMascotas();
  document.getElementById('modalAlerta').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function abrirEditar(id) {
  const a = alertas.find(x => x.id === id);
  if (!a) return;
  editId = id;

  document.getElementById('modalTitle').textContent = `Editar — ${a.mascota} · ${a.tipo}`;
  document.getElementById('btnEliminarAlerta').style.display = 'block';
  document.getElementById('fTipo').value = a.tipo;
  document.getElementById('fDesc').value = a.desc || '';
  document.getElementById('fFecha').value = a.fecha;
  document.getElementById('fRecordar').value = String(a.recordar);
  document.getElementById('fNotas').value = a.notas || '';

  poblarMascotas();
  document.getElementById('fMascota').value = a.mascota;

  document.getElementById('modalAlerta').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  document.getElementById('modalAlerta').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalAlerta').addEventListener('click', e => {
  if (e.target === e.currentTarget) cerrarModal();
});

// ═══════════════════════════════════════
// GUARDAR
// ═══════════════════════════════════════
function guardarAlerta() {
  const mascota = document.getElementById('fMascota').value;
  const fecha = document.getElementById('fFecha').value;

  if (!mascota || !fecha) { showToast('Completa los campos obligatorios', 'err'); return; }

  const data = {
    mascota,
    tipo: document.getElementById('fTipo').value,
    desc: document.getElementById('fDesc').value.trim(),
    fecha,
    recordar: parseInt(document.getElementById('fRecordar').value),
    notas: document.getElementById('fNotas').value.trim()
  };

  if (editId) {
    const idx = alertas.findIndex(x => x.id === editId);
    alertas[idx] = { ...alertas[idx], ...data };
    showToast('✅ Alerta actualizada', 'ok');
  } else {
    alertas.push({ id: Date.now(), ...data });
    showToast('✅ Alerta creada', 'ok');
  }

  guardarAlertas();
  render();
  cerrarModal();
}

// ═══════════════════════════════════════
// ELIMINAR
// ═══════════════════════════════════════
function eliminarAlerta() {
  const a = alertas.find(x => x.id === editId);
  if (!a) return;
  if (!confirm(`¿Eliminar la alerta de ${a.mascota} · ${a.tipo}?`)) return;
  alertas = alertas.filter(x => x.id !== editId);
  guardarAlertas();
  render();
  cerrarModal();
  showToast('🗑 Alerta eliminada', 'err');
}

function confirmarEliminar(id) {
  const a = alertas.find(x => x.id === id);
  if (!a) return;
  if (!confirm(`¿Eliminar la alerta de ${a.mascota} · ${a.tipo}?`)) return;
  alertas = alertas.filter(x => x.id !== id);
  guardarAlertas();
  render();
  showToast('🗑 Alerta eliminada', 'err');
}

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
function showToast(msg, type='') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast${type?' '+type:''}`;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// INIT
render();
</script>
</body>
</html>
